<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidtoon Comics!</title>
    <!-- Importing fun fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="logo">
            <!-- Using an emoji as a simple placeholder icon -->
            🚀 <h1>Kidtoon Comics</h1>
        </div>
        <nav>
            <a href="index.html" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Favorites ⭐</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero-section">
            <h2>Welcome to the Comic Universe! 🌟</h2>
            <p>Pick a story below and start your adventure!</p>
        </section>

        <section class="comic-grid" id="comic-grid">
            <!-- Comic cards will be dynamically injected here via app.js -->
        </section>
    </main>

    <footer>
        <p>Created for fun reading! 📚✨</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
